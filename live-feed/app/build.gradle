plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome.livefeed'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome.livefeed'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Sideloaded over ADB, never published: sign with the debug key
            // so it installs over a debug build, same as the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Framework APIs only (JobScheduler, HttpURLConnection, org.json):
// no dependencies at all.
dependencies {
}
